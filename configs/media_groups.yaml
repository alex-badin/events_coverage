# Draft source grouping for comparative dashboard work.
# This file is a working analytical grouping, not a final political label set.
# Review before using it in public-facing charts.

metadata:
  status: draft
  basis:
    - channel_metadata table where available
    - source names visible in the current news dataset
  caution: >-
    Every source in the news database is now either in a group or in the `archived`
    list below. Nothing is unassigned. Archived sources are out of scope and are
    filtered out of the event datasets and the warehouse; they are kept here by name
    so the exclusion stays visible and reversible.

groups:
  state_agencies:
    label: "State agencies"
    sources:
      - tass_agency
      - rian_ru

  federal_tv_and_state_broadcasters:
    label: "Federal TV and state broadcasters"
    sources:
      - news_1tv
      - ntvnews
      - rentv_news
      - rt_russian
      - tvc_ru
      - tvrussia1
      - vestiru24
      - zvezdanews

  pro_government_online:
    label: "Pro-government online media"
    sources:
      - aifonline
      - gazetaru
      - izvestia
      - lifenews
      - margaritasimonyan
      - readovkanews
      - rgrunews
      - riafan
      - rusvesnasu
      - solovievlive
      - svpressaru
      - truekpru
      - tsargradtv
      - uranews

  mainstream_business_and_general:
