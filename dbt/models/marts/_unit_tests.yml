version: 2

unit_tests:
  - name: event_group_coverage_calculates_core_metrics
    description: >
      Two small invented media groups make the metric arithmetic readable by
      inspection: group A has 2 of 8 matched posts and group B has 6 of 8.
      The fixture also checks active-source coverage, coverage per 1,000 posts,
      lag from the window opening, and first-mention order.
    model: event_group_coverage
    given:
      - input: ref('int_event_source_window')
        format: dict
        rows:
          - event_id: test-event
            event_slug: test_event
            source_name: source_a1
            media_group: Group A
            media_group_key: group_a
            posts_published_in_window: 100
            matched_posts: 2
            digest_posts: 1
            first_matched_at: '2025-01-01 12:00:00'
            last_matched_at: '2025-01-02 12:00:00'
            views_total: 300
            forwards_total: 30
            covered_event: true
          - event_id: test-event
            event_slug: test_event
            source_name: source_a2
            media_group: Group A
            media_group_key: group_a
            posts_published_in_window: 100
            matched_posts: 0
            digest_posts: 0
            first_matched_at: null
            last_matched_at: null
            views_total: null
            forwards_total: null
            covered_event: false
          - event_id: test-event
            event_slug: test_event
            source_name: source_b1
            media_group: Group B
            media_group_key: group_b
            posts_published_in_window: 300
            matched_posts: 6
            digest_posts: 0
            first_matched_at: '2025-01-01 06:00:00'
            last_matched_at: '2025-01-03 12:00:00'
            views_total: 1200
            forwards_total: 60
            covered_event: true

      - input: ref('int_event_messages')
        format: dict
        rows:
          - {event_id: test-event, media_group: Group A, published_date: '2025-01-01', views: 100, rerank_score: 0.50}
          - {event_id: test-event, media_group: Group A, published_date: '2025-01-02', views: 200, rerank_score: 0.70}
          - {event_id: test-event, media_group: Group B, published_date: '2025-01-01', views: 100, rerank_score: 0.40}
          - {event_id: test-event, media_group: Group B, published_date: '2025-01-01', views: 150, rerank_score: 0.50}
          - {event_id: test-event, media_group: Group B, published_date: '2025-01-02', views: 175, rerank_score: 0.60}
          - {event_id: test-event, media_group: Group B, published_date: '2025-01-02', views: 200, rerank_score: 0.70}
          - {event_id: test-event, media_group: Group B, published_date: '2025-01-03', views: 250, rerank_score: 0.80}
          - {event_id: test-event, media_group: Group B, published_date: '2025-01-03', views: 325, rerank_score: 0.90}

      - input: ref('stg_event_datasets')
        format: dict
        rows:
          - event_id: test-event
            event_slug: test_event
            event_name: Test event
            fom_year: 2025
            fom_week: 1
            attention_percentage: 20.0
            match_start: '2025-01-01'
            match_end_exclusive: '2025-01-15'

    expect:
      format: dict
      rows:
        - media_group: Group A
          matched_posts: 2
          sources_covering: 1
          sources_active: 2
          posts_published_in_window: 200
          covered_event: true
          share_of_voice: 0.25
          source_coverage_rate: 0.5
          matched_posts_per_1000_published: 10.0
          coverage_lag_hours: 12
          days_with_coverage: 2
          first_mention_rank: 2
          views_per_matched_post: 150.0
        - media_group: Group B
          matched_posts: 6
          sources_covering: 1
          sources_active: 1
          posts_published_in_window: 300
          covered_event: true
          share_of_voice: 0.75
          source_coverage_rate: 1.0
          matched_posts_per_1000_published: 20.0
          coverage_lag_hours: 6
          days_with_coverage: 3
          first_mention_rank: 1
          views_per_matched_post: 200.0
