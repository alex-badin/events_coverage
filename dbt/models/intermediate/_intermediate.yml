version: 2

models:
  - name: int_event_messages
    description: >
      One matched post seen in the context of one event: the post, the media group that
      published it, and where it sits inside the event's search window.
    columns:
      - name: event_id
        data_tests: [not_null]
      - name: media_group
        description: Group label, never left empty.
        data_tests: [not_null]
      - name: hours_from_window_start
        description: >
          Hours between the moment the search window opened and the post. The window
          opens at the same instant for every group, so this is comparable across them.
        data_tests: [not_null]

  - name: int_event_source_window
    description: >
      One row per source per event, covering every source that published anything at all
      during the event's window — not only the ones that covered the event. Sources with
      no matched posts appear with a zero, which is what makes silence measurable.
    columns:
      - name: event_id
        data_tests: [not_null]
      - name: source_name
        data_tests: [not_null]
      - name: posts_published_in_window
        description: All posts that source published in the window, on any topic.
        data_tests: [not_null]
      - name: matched_posts
        description: Posts by that source matched to this event. Zero is a real answer.
        data_tests: [not_null]
      - name: covered_event
        description: Whether the source published anything matched to this event.
        data_tests: [not_null]

  - name: int_post_tokens
    description: >
      One word of one distinct post text, in the order it appears. The raw material for comparing
      the vocabulary of different media groups. Splitting the texts into words happens here
      once, so single words and two-word phrases are built from the same word stream and
      cannot disagree with each other. A table: a view would split every text again on each
      read.
    columns:
      - name: post_text_id
        description: A hash of the post text, the same in every event that matched the post.
        data_tests: [not_null]
      - name: word_position
        description: >
          Where the word sits in the post. Needed because a phrase is two words that stood
          next to each other, which cannot be recovered once the order is lost.
        data_tests: [not_null]
      - name: word
        description: The word as written, lowercased.
        data_tests: [not_null]
      - name: is_stopword
        description: >
          Flagged rather than removed. Single-word counting drops these; phrase building
          needs to know where they were.
        data_tests: [not_null]
      - name: is_source_name
        description: The word is the name of a source. Channels sign their posts, so it is not counted.
        data_tests: [not_null]

  - name: int_word_lemmas
    description: >
      One distinct word of the matched posts with the dictionary form it is counted under, from the
      pymorphy3 dictionary, so that «войны» and «войну» count as «война». Frequent misreadings are
      corrected by seeds/word_lemma_overrides.csv.
    columns:
      - name: word
        data_tests: [not_null, unique]
      - name: lemma
        data_tests: [not_null]
      - name: lemma_source
        description: "'dictionary', or 'override' when seeds/word_lemma_overrides.csv set it."
        data_tests:
          - accepted_values:
              arguments:
                values: ['dictionary', 'override']

  - name: int_post_term_forms
    description: One spelling of one word or two-word phrase in one distinct post text. The labels come from here.
    columns:
      - name: post_text_id
        data_tests: [not_null]
      - name: term_hash
        description: A number standing for term_type and term_key, used for all the counting downstream.
        data_tests: [not_null]
      - name: term_type
        description: Whether the row is a single word or two words that stood next to each other.
      - name: term_key
        description: The dictionary form, or the two dictionary forms of a phrase.
        data_tests: [not_null]
      - name: term_form
        description: The spelling as written.
        data_tests: [not_null]
      - name: term_uses
        description: How many times the text uses this spelling.

  - name: int_post_terms
    description: One word or two-word phrase in one distinct post text, whatever its spellings.
    columns:
      - name: post_text_id
        data_tests: [not_null]
      - name: term_hash
        data_tests: [not_null]
      - name: term_uses
        description: How many times the text uses the term.

  - name: int_event_posts_with_words
    description: >
      One matched post in one event, for posts with at least one countable word. The denominator
      for every share in event_group_terms.
    columns:
      - name: post_text_id
        data_tests: [not_null]

  - name: int_event_source_terms
    description: >
      One word or phrase per source per event: every term, counts only. The lists of posts are built
      later, in event_group_terms, and only for the terms that pass its filters.
    columns:
      - name: posts_with_term
        data_tests: [not_null]

  - name: int_event_group_term_scores
    description: >
      One word or phrase per media group per event, for the terms that pass the filters of
      event_group_terms: counts and scores only, no words and no lists of posts.
    columns:
      - name: posts_with_term
        data_tests: [not_null]

  - name: int_event_group_term_posts
    description: One post carrying one term, for the terms that survived int_event_group_term_scores.
    columns:
      - name: message_id
        data_tests: [not_null]

  - name: int_event_group_term_lists
    description: The exact posts each surviving term of each media group in each event was counted in.

  - name: int_event_group_term_labels
    description: The spelling shown for each surviving term of each media group in each event.
    columns:
      - name: term_label
        data_tests: [not_null]

  - name: int_events_with_themes
    description: >
      Every FOM survey row with the cross-week theme of its event, from the two theme
      seeds. Specific events get a theme; catch-all categories and the non-response line
      do not, because they are not subjects.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: theme_id
        description: >
          The subject the event is mainly about. Empty for rows that are not specific
          events, and for a specific event whose wording has not been labelled yet.
        data_tests:
          - relationships:
              arguments:
                to: ref('fom_themes')
                field: theme_id
          - not_null:
              name: every_specific_event_has_a_theme
              config:
                where: "event_kind = 'specific event'"
                severity: warn
