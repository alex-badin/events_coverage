# Connection settings. The name below must match `profile:` in dbt_project.yml.
#
# Kept inside the repository (not in ~/.dbt/) so the whole setup is visible and
# version-controlled. It holds no secrets — the warehouse is a local file.
# The path is relative to the working directory, so run dbt from inside dbt/.

events_coverage:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/warehouse/events.duckdb
      threads: 4
      # Word lists split about 69 million words. These caps keep a build from taking over a
      # 16 GB laptop: DuckDB spills to disk past the first and fails cleanly past the second.
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '6GB') }}"
        max_temp_directory_size: 30GB
        preserve_insertion_order: false
