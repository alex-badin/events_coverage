model: gemini-2.5-pro-exp-03-25

prompt_detailed: |
  В этом PDF документе представлена таблица с событиями, о которых респонденты говорили как о самых значимых. Таблица имеет три столбца:
    • Первый столбец: Основное название события.
    • Второй столбец: Цитаты респондентов, описывающие событие. В некоторых случаях в этом столбце содержатся и подсобытия — они выделены жирным шрифтом.
    • Третий столбец: Процент респондентов, назвавших это событие или подсобытие (числовое значение).

  Внимательно выполни следующие шаги:
    1. Анализ структуры:
    • Если во втором столбце нет элементов, выделенных жирным шрифтом, то считаем, что событие задано полностью: название из первого столбца, цитаты из второго столбца и процент из третьего.
    • Если во втором столбце присутствуют подсобытия (элементы, выделенные жирным шрифтом), то основное название из первого столбца игнорируй. Для итогового списка используй только подсобытия.
    2. Обработка цитат:
    • Если в ячейке со списком цитат содержатся несколько фрагментов, разделённых точками с запятой, запятыми или переводами строки, объединяй их в один список цитат для данного события или подсобытия.
    • Не создавай отдельное событие для каждой цитаты — все цитаты, относящиеся к одному событию, должны быть объединены в список.
    3. Извлечение процентов:
    • Процент респондентов всегда берётся из третьего столбца. Он относится как к основному событию (если нет подсобытий), так и ко всем подсобытиям (если они присутствуют).
    4. Формат итогового результата:
    • Каждый элемент итогового списка должен содержать три атрибута:
    • название: Название события (либо, если присутствуют подсобытия, название конкретного подсобытия).
    • цитаты: Список всех цитат, связанных с данным событием или подсобытием.
    • процент: Числовое значение процента респондентов.
    5. Пример ожидаемого вывода (в формате JSON):
    [
  {
    "название": "Военная спецоперация России на Украине",
    "цитаты": [
      "«Специальная военная операция на Украине»; «дела на Украине и проведение операции»; «военные сводки»; ...",
      "«события на фронтах Украины»; «то, что мы топчемся на месте в специальной операции»; ..."
    ],
    "процент": 32
  },
  {
    "название": "Обмен военнопленными",
    "цитаты": [
      "«Возвращение в Россию военнопленных»; «возвращение домой россиян из украинского плена»; «наши ребята вернулись из плена»; ..."
    ],
    "процент": 2
  },
  {
    "название": "Подсобытие: [название подсобытия из жирного текста]",
    "цитаты": [
      "Цитата, относящаяся к подсобытию"
    ],
    "процент": [соответствующий процент из третьего столбца]
  }
    ]
    6. Дополнительные уточнения:
    • Если в одной ячейке встречается смесь цитат и названия (например, часть строки выглядит как название, а далее — как цитаты), разделяй их по следующим правилам:
    • Если цитаты находятся в кавычках, считай их за отдельные цитаты.
    • Если до первой кавычки идёт фрагмент, воспринимай его как название, а всё, что внутри кавычек — как цитаты.
    • Внимательно анализируй структуру текста, чтобы не разделять отдельные цитаты как самостоятельные события.
    • Всегда используй только числовое значение из третьего столбца для процента, независимо от того, обрабатываешь основное событие или подсобытия.