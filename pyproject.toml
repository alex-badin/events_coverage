[project]
name = "events-coverage"
version = "0.1.0"
description = "Historical comparison of how different media groups cover key public events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.11",
    "numpy>=1.26",
    "openai>=1.40",
    "pandas>=2.2",
    "plotly>=5.22",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "duckdb>=1.5.5",
    "dbt-duckdb>=1.10.1",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-dbt>=0.29,<0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
