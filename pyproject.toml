[project]
name = "events-coverage"
version = "0.1.0"
description = "Historical comparison of how different media groups cover key public events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.11",
    "duckdb>=1.0",
    "numpy>=1.26",
    "openai>=1.40",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
